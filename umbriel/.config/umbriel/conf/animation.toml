# Animation
# https://docs.noctalia.dev/umbriel/animation/

# Window-rule opacity and blur fade on focus changes by default. Disable this
# independently of border fades, or choose its own duration and curve.
# [animation.windows_opacity]
# enabled = true
# curve = "spring:1,900"
# duration_ms = 250 # For non-spring curves; a spring sets its own length.

# Optional live workspace reveal (see docs/user/animation.md).
# Add the bundled effects/animation/workspace_wipe/effect.toml to your includes.
# [animation.workspaces]
# style = "reveal"          # Default: "slide"
# effect = "workspace_wipe"
# duration_ms = 300
# curve = "easeout"

# Shade over a window while a modal dialog is attached to it.
# [animation.dialogs]
# dim = 0.3

# Scratchpad animation: disable background dim so transparent terminals
# show windows underneath instead of a dark overlay.
[animation.scratchpad]
enabled = true
dim = 0.0
blur = false