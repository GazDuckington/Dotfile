# Hyprland window rules (converted from Hyprland config.lua)
# Blur windows over the cached wallpaper blur. Set blur_optimized = false to
# include overlapping windows behind them, at a GPU cost on every frame that
# moves anything behind them.

[[window_rule]]
match.app_id = "^(pulsemixer|termmenu|/home/gaz/.local/bin/hyprswitch.sh|wiremix)$"
default_floating = true
default_floating_size_px = { width = 768, height = 200 }

[[window_rule]]
match.app_id = "^(pavucontrol|org.pulseaudio.pavucontrol|com.gabm.satty)$"
default_floating = true
