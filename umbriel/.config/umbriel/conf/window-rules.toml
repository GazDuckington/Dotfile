default_floating = true

[[window_rule]]
match.app_id = "^(firefox|zen|helium|.*-[Bb]rowser.*)$"
default_floating = true

[[window_rule]]
match.app_id = "^(com.Streamium|Streamium)"
default_floating = true

[[window_rule]]
match.app_id = "^([Bb]eekeeper-studio)$"
default_floating = true

[[window_rule]]
match.app_id = "^([Ss]team)$"
default_floating = true

[[window_rule]]
match.app_id = "^(ru-turikhay-tlauncher-bootstrap-Bootstrap|[Mm]inecraft.*)$"
